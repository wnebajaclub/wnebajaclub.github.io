<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanks for your response!</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/img/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  :root {
    --bg: #04070d;
    --surface: #0c121c;
    --line: #1c2534;
    --text: #f2f0ea;
    --muted: #8b93a3;
    --gold: #cf9d33;
    --gold-bright: #e6b64a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 1.5rem;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }

  .card {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .logo {
    display: block;
    height: 80px;
    margin: 0 auto 2.5rem;
    opacity: 0.95;
  }

  .logo-fallback {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }

  .flag-plate {
    display: inline-block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1rem 1.5rem;
    margin: 0 auto 2rem;
  }

  .flags {
    height: 110px;
    width: auto;
    display: block;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.9rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0 0 1.1rem;
    text-wrap: balance;
  }

  p.lede {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--muted);
    max-width: 30rem;
    margin: 0 auto 2.75rem;
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
  }

  .btn {
    display: inline-block;
    background: var(--gold);
    color: #14100a;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    text-decoration: none;
    padding: 0.85rem 2.1rem;
    border-radius: 2px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn:hover  { background: var(--gold-bright); transform: translateY(-1px); }
  .btn:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }

  .secondary {
    color: var(--muted);
    font-size: 0.9rem;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .secondary:hover { color: var(--text); border-color: var(--line); }

  footer {
    margin-top: 4rem;
    font-size: 0.8rem;
    color: #4b5361;
  }
</style>
</head>
<body>
  <main class="card">
    <img
      class="logo"
      src="assets/img/logo.png"
      alt="Golden Bear Racing"
      onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';"
    />
    <div class="logo-fallback" id="logoFallback" style="display:none;">GOLDEN BEAR RACING</div>

    <div class="flag-plate">
      <img class="flags" src="assets/img/checkered-flags.png" alt="" aria-hidden="true" />
    </div>

    <h1>You crossed the finish line.</h1>
    <p class="lede">
      Thanks for completing the form — we've got your submission. While you're here,
      come see what we're building this season.
    </p>

    <div class="actions">
      <a class="btn" href="index.html#gbr4">See This Year's Car</a>
      <a class="secondary" href="index.html">Back to the homepage</a>
    </div>

    <footer>Golden Bear Racing · Western New England University Baja SAE</footer>
  </main>
</body>
</html>
